<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="__SITE_DESCRIPTION__">
    <meta name="theme-color" content="#f6f7f9">
    <link rel="alternate" type="application/rss+xml" title="__SITE_NAME__ 的笔记" href="__SITE_URL__feed.xml">
    <link rel="sitemap" type="application/xml" href="__SITE_URL__sitemap.xml">
    <link rel="canonical" href="__SITE_URL__">
    <meta property="og:site_name" content="__SITE_NAME__">
    <meta property="og:type" content="website">
    <meta property="og:title" content="__SITE_NAME__">
    <meta property="og:description" content="__SITE_DESCRIPTION__">
    <meta property="og:url" content="__SITE_URL__">
    <meta property="og:image" content="__SITE_URL__og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <title>__SITE_NAME__</title>
    <script>
      // 在样式生效前定好主题，避免深色模式下闪一下白屏
      (function () {
        var stored;
        try { stored = localStorage.getItem('site.theme'); } catch (error) {}
        document.documentElement.dataset.theme = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
