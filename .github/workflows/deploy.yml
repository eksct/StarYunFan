name: Build and verify

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 默认 GITHUB_TOKEN 仅能推同一仓库；推外部仓库 StarYunFanSite 需要 PAT
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test note data helpers
        run: pnpm test

      - name: Build static site and note pages
        run: pnpm run build
